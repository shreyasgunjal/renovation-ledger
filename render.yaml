services:
  - type: web
    name: renovation-ledger-api
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 8080
      - key: DB_URL
        value: postgresql://user:pass@host:5432/dbname
      - key: DB_USERNAME
        value: user
      - key: DB_PASSWORD
        value: pass
      - key: APP_ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: UPLOAD_DIR
        value: /tmp/uploads
